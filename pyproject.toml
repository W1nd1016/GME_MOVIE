[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gme-movie-coldstart"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "torch>=2.0", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coldstart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
